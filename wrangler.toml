name = "gzh-design-web"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 说明：
# - 本项目前端构建产物在 dist/，API 在 functions/（Cloudflare Pages Functions）。
# - 本地开发：npm run build && wrangler pages dev
# - 部署：由 GitHub Actions 执行（.github/workflows/deploy.yml）：push main → npm ci → npm run build
#   → 本地 node_modules 的 wrangler 执行 `wrangler pages deploy dist --project-name=gzh-design-web --branch=main`。
# - 本项目采用 BYOK（用户自带 API key），因此无需配置任何服务端密钥。

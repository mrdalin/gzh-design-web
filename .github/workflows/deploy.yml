name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # skillAssets.ts 已随仓库提交，CI 无需重新生成（构建机没有本地 skill）
      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # 首次部署前确保 Cloudflare Pages 项目存在（直接调 API，已存在会返回 409 可忽略，保证幂等）
      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"gzh-design-web","production_branch":"main"}' || true

      # 直接用 npm ci 已安装的本地 wrangler 部署，绕开 wrangler-action
      # 在 GitHub 强制 Node 24 runner 下的兼容问题（截图 npx exit code 1）
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler pages deploy dist --project-name=gzh-design-web --branch=main
